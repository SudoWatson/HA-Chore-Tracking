mark_done:
  name: Mark done
  description: Reset a chore's "days since last done" counter to zero.
  target:
    entity:
      domain: sensor
      integration: chore
  fields:
    when:
      name: When
      description: >-
        Timestamp to use instead of now. Mainly useful for testing/debugging
        - e.g. backdating a chore a few days to see it turn due/overdue.
      required: false
      selector:
        datetime: {}
